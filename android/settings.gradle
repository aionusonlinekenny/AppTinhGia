      from(files(new File([nodeCmd, "--print", "require.resolve('react-native/package.json')"]
        .execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
    }
  }
}

apply from: new File([nodeCmd, "--print", "require.resolve('expo/package.json')"]
