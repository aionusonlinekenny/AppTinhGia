pluginManagement {
  // Find node on Windows (Android Studio runs with limited PATH)
  def nodeCmd = findNodeExecutable(rootDir)

  def version = [nodeCmd, "-e", "console.log(require('react-native/package.json').version);"]
    .execute(null, rootDir).text.trim()
  def (_, reactNativeMinor, reactNativePatch) = version.split("-")[0].tokenize('.').collect { it.toInteger() }

  includeBuild(new File([nodeCmd, "--print", "require.resolve('@react-native/gradle-plugin/package.json')"]
    .execute(null, rootDir).text.trim()).getParentFile().toString())
  if (reactNativeMinor == 74 && reactNativePatch <= 3) {
    includeBuild("react-settings-plugin")
  }
}

// Helper: resolve node binary across environments (PATH, Windows common paths, local.properties)
def findNodeExecutable(rootDir) {
  // Check local.properties first
  def localProps = new File(rootDir, "local.properties")
  if (localProps.exists()) {
    def props = new Properties()
    localProps.withInputStream { props.load(it) }
    def nodePath = props.getProperty("node.binary")
    if (nodePath && new File(nodePath).exists()) return nodePath
  }
  def candidates = [
    "node",
    "C:\\Program Files\\nodejs\\node.exe",
    "C:\\Program Files (x86)\\nodejs\\node.exe",
    System.getenv('APPDATA') ? "${System.getenv('APPDATA')}\\npm\\node.exe" : null,
    System.getenv('ProgramFiles') ? "${System.getenv('ProgramFiles')}\\nodejs\\node.exe" : null,
    System.getenv('LOCALAPPDATA') ? "${System.getenv('LOCALAPPDATA')}\\Programs\\nodejs\\node.exe" : null,
    "/usr/local/bin/node",
    "/usr/bin/node",
  ].findAll { it != null }
  for (candidate in candidates) {
    try {
      def proc = [candidate, "--version"].execute()
      proc.waitFor()
      if (proc.exitValue() == 0) return candidate
    } catch (Exception ignored) {}
  }
  return "node"
}

plugins { id("com.facebook.react.settings") }

def getRNMinorVersion() {
  def nodeCmd = findNodeExecutable(rootDir)
  def version = [nodeCmd, "-e", "console.log(require('react-native/package.json').version);"]
    .execute(null, rootDir).text.trim()
  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }
  return minor
}

if (getRNMinorVersion() >= 75) {
  extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    if (System.getenv('EXPO_UNSTABLE_CORE_AUTOLINKING') == '1') {
      println('[32mUsing expo-modules-autolinking as core autolinking source[0m')
      def nodeCmd = findNodeExecutable(rootDir)
      def command = [
        nodeCmd, '--no-warnings', '--eval',
        'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
        'react-native-config', '--json', '--platform', 'android'
      ].toList()
      ex.autolinkLibrariesFromCommand(command)
    } else {
      ex.autolinkLibrariesFromCommand()
    }
  }
}

