pluginManagement {
  // Find node.exe on Windows where Android Studio PATH differs from user PATH
  def findNode = { ->
    // 1. Check local.properties for explicit path
    def lp = new File(rootDir, "local.properties")
    if (lp.exists()) {
      def p = new Properties(); lp.withInputStream { p.load(it) }
      def n = p.getProperty("node.binary")
      if (n && new File(n).exists()) return n
    }
    // 2. Try common Windows install locations
    for (path in [
      "C:\\Program Files\\nodejs\\node.exe",
      "C:\\Program Files (x86)\\nodejs\\node.exe",
      "${System.getenv('APPDATA')}\\npm\\node.exe",
      "${System.getenv('ProgramFiles')}\\nodejs\\node.exe",
      "${System.getenv('LOCALAPPDATA')}\\Programs\\nodejs\\node.exe",
    ]) {
      try { if (path && new File(path).exists()) return path } catch (ignored) {}
    }
    // 3. Fallback to PATH
    return "node"
  }
  def nodeExe = findNode()

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeExe, "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)

  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(nodeExe, "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = 'Menu Cost Pro'

expoAutolinking.useExpoVersionCatalog()

include ':app'
includeBuild(expoAutolinking.reactNativeGradlePlugin)
