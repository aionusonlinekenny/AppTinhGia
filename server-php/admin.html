<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Cost Pro — License Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #F5F5F5; color: #212121; }

  /* Login */
  #loginScreen { display: flex; align-items: center; justify-content: center;
                 min-height: 100vh; padding: 20px; }
  .loginCard { background: #fff; border-radius: 16px; padding: 40px;
               max-width: 380px; width: 100%;
               box-shadow: 0 4px 24px rgba(0,0,0,.1); text-align: center; }
  .loginCard h1 { font-size: 22px; margin-bottom: 6px; color: #E65100; }
  .loginCard p  { font-size: 13px; color: #888; margin-bottom: 24px; }
  .loginCard input { width: 100%; padding: 12px 16px; border: 1.5px solid #DDD;
                     border-radius: 10px; font-size: 15px; margin-bottom: 12px;
                     letter-spacing: 1px; }
  .loginCard input:focus { outline: none; border-color: #E65100; }

  /* Main */
  #mainScreen { display: none; }
  .topbar { background: #E65100; color: #fff; padding: 16px 24px;
            display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 18px; }
  .topbar span { font-size: 12px; opacity: .7; }

  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

  /* Add key form */
  .addCard { background: #fff; border-radius: 12px; padding: 20px;
             margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .addCard h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; color: #E65100; }
  .formRow { display: flex; gap: 10px; flex-wrap: wrap; }
  .formRow input, .formRow select { flex: 1; min-width: 140px; padding: 10px 12px;
    border: 1.5px solid #DDD; border-radius: 8px; font-size: 14px; }
  .formRow input:focus, .formRow select:focus { outline: none; border-color: #E65100; }

  /* Buttons */
  .btn { padding: 10px 18px; border: none; border-radius: 8px; font-size: 13px;
         font-weight: 600; cursor: pointer; transition: opacity .15s; }
  .btn:hover { opacity: .85; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn-primary  { background: #E65100; color: #fff; }
  .btn-success  { background: #388E3C; color: #fff; }
  .btn-danger   { background: #E53935; color: #fff; }
  .btn-warning  { background: #F57C00; color: #fff; }
  .btn-outline  { background: transparent; border: 1.5px solid #DDD; color: #555; }
  .btn-sm       { padding: 6px 12px; font-size: 12px; }

  /* Stats */
  .statsRow { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .statCard { flex: 1; min-width: 120px; background: #fff; border-radius: 10px;
              padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .statVal  { font-size: 28px; font-weight: 800; color: #E65100; }
  .statLbl  { font-size: 11px; color: #888; margin-top: 4px; }

  /* Key list */
  .keyCard { background: #fff; border-radius: 12px; padding: 16px;
             margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .keyTop  { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .keyCode { font-size: 17px; font-weight: 800; font-family: monospace;
             color: #212121; letter-spacing: 1px; cursor: pointer; }
  .keyCode:hover { color: #E65100; }
  .badge   { display: inline-block; padding: 3px 10px; border-radius: 20px;
             font-size: 11px; font-weight: 700; }
  .badge-active   { background: #E8F5E9; color: #388E3C; }
  .badge-inactive { background: #FFEBEE; color: #E53935; }
  .keyMeta { font-size: 12px; color: #888; margin-top: 6px; }
  .keyMeta span { margin-right: 16px; }
  .keyActions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .copied { color: #388E3C; font-size: 12px; font-weight: 600; }

  /* Search */
  .searchRow { display: flex; gap: 10px; margin-bottom: 16px; }
  .searchRow input { flex: 1; padding: 10px 14px; border: 1.5px solid #DDD;
                     border-radius: 8px; font-size: 14px; }
  .searchRow input:focus { outline: none; border-color: #E65100; }

  /* Tab nav */
  .tabNav { display: flex; gap: 4px; margin-bottom: 20px; background: rgba(255,255,255,.15);
            border-radius: 10px; padding: 4px; width: fit-content; }
  .tabNav button { padding: 8px 20px; border: none; border-radius: 7px; font-size: 13px;
                   font-weight: 600; cursor: pointer; background: transparent; color: rgba(255,255,255,.75); }
  .tabNav button.active { background: #fff; color: #E65100; }
  .tabNav .badge-count { display: inline-block; background: #E53935; color: #fff;
                         font-size: 10px; border-radius: 10px; padding: 1px 6px; margin-left: 4px; }

  /* Order cards */
  .orderCard { background: #fff; border-radius: 12px; padding: 16px;
               margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .orderTop  { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .orderName { font-size: 15px; font-weight: 700; color: #212121; }
  .badge-pending   { background: #FFF3E0; color: #E65100; }
  .badge-paid      { background: #E3F2FD; color: #1565C0; }
  .badge-fulfilled { background: #E8F5E9; color: #388E3C; }
  .badge-cancelled { background: #FAFAFA; color: #999; }
  .orderMeta { font-size: 12px; color: #888; margin-top: 6px; }
  .orderMeta span { margin-right: 14px; }
  .orderActions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

  /* Toast */
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
           background: #323232; color: #fff; padding: 12px 24px; border-radius: 8px;
           font-size: 14px; display: none; z-index: 999; }

  .empty { text-align: center; padding: 40px; color: #aaa; font-size: 14px; }
  .genBtn { margin-left: 8px; font-size: 11px; }

  @media (max-width: 600px) {
    .formRow { flex-direction: column; }
    .keyTop  { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginCard">
    <h1>🔐 License Admin</h1>
    <p>Menu Cost Pro — Key Manager</p>
    <input type="password" id="secretInput" placeholder="Enter admin secret" />
    <button class="btn btn-primary" style="width:100%;padding:13px" onclick="doLogin()">Login</button>
    <p id="loginErr" style="color:#E53935;font-size:12px;margin-top:10px;display:none">Incorrect secret</p>
  </div>
</div>

<!-- MAIN -->
<div id="mainScreen">
  <div class="topbar">
    <h1>🗝️ License Manager</h1>
    <div style="display:flex;align-items:center;gap:16px">
      <div class="tabNav">
        <button class="active" onclick="switchTab('keys')">🗝️ Keys</button>
        <button onclick="switchTab('orders')">📦 Orders <span class="badge-count" id="pendingCount" style="display:none">0</span></button>
      </div>
      <span id="serverLabel" style="font-size:11px;opacity:.6"></span>
    </div>
  </div>

  <!-- KEYS TAB -->
  <div id="tabKeys" class="container">

    <!-- Stats -->
    <div class="statsRow">
      <div class="statCard"><div class="statVal" id="statTotal">—</div><div class="statLbl">Total Keys</div></div>
      <div class="statCard"><div class="statVal" id="statActive">—</div><div class="statLbl">Active</div></div>
      <div class="statCard"><div class="statVal" id="statActivated">—</div><div class="statLbl">Activated Devices</div></div>
      <div class="statCard"><div class="statVal" id="statInactive">—</div><div class="statLbl">Deactivated</div></div>
    </div>

    <!-- Add key -->
    <div class="addCard">
      <h2>➕ Create New License Key</h2>
      <div class="formRow">
        <input id="newKey" placeholder="Key code (auto-generate or type)" style="font-family:monospace;font-weight:700;letter-spacing:1px" />
        <button class="btn btn-outline genBtn" onclick="generateKey()">🎲 Generate</button>
      </div>
      <div class="formRow" style="margin-top:10px">
        <input id="newCustomer" placeholder="Customer name (e.g. Pho Hung Restaurant)" />
        <select id="newMaxDevices">
          <option value="1">1 device</option>
          <option value="2">2 devices</option>
          <option value="3">3 devices</option>
          <option value="5">5 devices</option>
        </select>
        <input id="newNotes" placeholder="Notes (optional)" />
        <button class="btn btn-primary" onclick="addKey()">Add Key</button>
      </div>
    </div>

    <!-- Key list -->
    <div class="searchRow">
      <input id="searchInput" placeholder="🔍 Search by key or customer..." oninput="renderKeys()" />
      <button class="btn btn-outline" onclick="loadKeys()">↻ Refresh</button>
    </div>

    <div id="keyList"><div class="empty">Loading...</div></div>
  </div><!-- /tabKeys -->

  <!-- ORDERS TAB -->
  <div id="tabOrders" class="container" style="display:none">
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <select id="orderFilter" onchange="renderOrders()" style="padding:9px 12px;border:1.5px solid #DDD;border-radius:8px;font-size:13px">
        <option value="all">All orders</option>
        <option value="pending" selected>Pending</option>
        <option value="paid">Paid</option>
        <option value="fulfilled">Fulfilled</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <button class="btn btn-outline" onclick="loadOrders()">↻ Refresh</button>
    </div>
    <div id="orderList"><div class="empty">Loading...</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Config ───────────────────────────────────────────────────────
const API_BASE = 'https://stonephovaldosta.com/license-api';

let ADMIN_SECRET = '';
let allKeys   = [];
let allOrders = [];

// ── Tab switching ────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('tabKeys').style.display    = tab === 'keys'   ? 'block' : 'none';
  document.getElementById('tabOrders').style.display  = tab === 'orders' ? 'block' : 'none';
  document.querySelectorAll('.tabNav button').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'keys') || (i === 1 && tab === 'orders'));
  });
  if (tab === 'orders') loadOrders();
}

// ── Login ────────────────────────────────────────────────────────
document.getElementById('secretInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const secret = document.getElementById('secretInput').value.trim();
  if (!secret) return;
  // Test with a real API call
  try {
    const res = await fetch(`${API_BASE}/admin-keys.php`, {
      headers: { 'X-Admin-Secret': secret }
    });
    if (res.status === 403) {
      document.getElementById('loginErr').style.display = 'block';
      return;
    }
    ADMIN_SECRET = secret;
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';
    document.getElementById('serverLabel').textContent = API_BASE;
    const data = await res.json();
    allKeys = data;
    renderKeys();
    updateStats();
    loadOrders(); // load order badge count in background
  } catch(e) {
    document.getElementById('loginErr').textContent = 'Cannot connect to server';
    document.getElementById('loginErr').style.display = 'block';
  }
}

// ── Load keys ────────────────────────────────────────────────────
async function loadKeys() {
  const res = await fetch(`${API_BASE}/admin-keys.php`, {
    headers: { 'X-Admin-Secret': ADMIN_SECRET }
  });
  allKeys = await res.json();
  renderKeys();
  updateStats();
}

function updateStats() {
  const active   = allKeys.filter(k => k.active == 1);
  const inactive = allKeys.filter(k => k.active == 0);
  const devices  = allKeys.reduce((s,k) => s + parseInt(k.activated_count||0), 0);
  document.getElementById('statTotal').textContent     = allKeys.length;
  document.getElementById('statActive').textContent    = active.length;
  document.getElementById('statInactive').textContent  = inactive.length;
  document.getElementById('statActivated').textContent = devices;
}

// ── Render ───────────────────────────────────────────────────────
function renderKeys() {
  const q   = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allKeys.filter(k =>
    k.key_code.toLowerCase().includes(q) ||
    k.customer.toLowerCase().includes(q)
  );

  const el = document.getElementById('keyList');
  if (filtered.length === 0) {
    el.innerHTML = '<div class="empty">No keys found</div>'; return;
  }

  el.innerHTML = filtered.map(k => `
    <div class="keyCard" id="card-${k.key_code}">
      <div class="keyTop">
        <span class="keyCode" title="Click to copy" onclick="copyKey('${k.key_code}')">${k.key_code}</span>
        <span class="badge ${k.active==1 ? 'badge-active' : 'badge-inactive'}">
          ${k.active==1 ? '✓ Active' : '✗ Inactive'}
        </span>
        <span id="copied-${k.key_code}" class="copied" style="display:none">✓ Copied!</span>
      </div>
      <div class="keyMeta">
        <span>👤 ${k.customer}</span>
        <span>📱 ${k.activated_count||0} / ${k.max_devices} device(s)</span>
        <span>📅 ${k.created_at ? k.created_at.split(' ')[0] : '—'}</span>
        ${k.notes ? `<span>📝 ${k.notes}</span>` : ''}
      </div>
      <div class="keyActions">
        ${k.active==1
          ? `<button class="btn btn-danger btn-sm" onclick="manageKey('${k.key_code}','deactivate')">🚫 Deactivate</button>`
          : `<button class="btn btn-success btn-sm" onclick="manageKey('${k.key_code}','activate')">✓ Activate</button>`
        }
        <button class="btn btn-warning btn-sm" onclick="manageKey('${k.key_code}','reset-devices')">🔄 Reset Devices</button>
        <button class="btn btn-outline btn-sm" onclick="copyKey('${k.key_code}')">📋 Copy Key</button>
        <button class="btn btn-danger btn-sm" style="background:#B71C1C" onclick="deleteKey('${k.key_code}')">🗑️ Delete</button>
      </div>
    </div>
  `).join('');
}

// ── Add key ──────────────────────────────────────────────────────
async function addKey() {
  const key        = document.getElementById('newKey').value.trim().toUpperCase();
  const customer   = document.getElementById('newCustomer').value.trim();
  const maxDevices = document.getElementById('newMaxDevices').value;
  const notes      = document.getElementById('newNotes').value.trim();

  if (!key || !customer) { toast('⚠️ Key and customer name are required'); return; }
  if (!/^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(key)) {
    toast('⚠️ Key format must be XXXX-XXXX-XXXX-XXXX'); return;
  }

  const res = await fetch(`${API_BASE}/admin-keys.php`, {
    method: 'POST',
    headers: { 'X-Admin-Secret': ADMIN_SECRET, 'Content-Type': 'application/json' },
    body: JSON.stringify({ key, customer, maxDevices: parseInt(maxDevices), notes }),
  });
  const data = await res.json();
  if (data.success) {
    toast(`✅ Key ${key} added for ${customer}`);
    document.getElementById('newKey').value = '';
    document.getElementById('newCustomer').value = '';
    document.getElementById('newNotes').value = '';
    loadKeys();
    // If created from an order, auto-fulfill it (sends key email to customer)
    if (window._pendingOrderId) {
      const orderId = window._pendingOrderId;
      window._pendingOrderId = null;
      const fres = await fetch(`${API_BASE}/admin-orders.php`, {
        method: 'POST',
        headers: { 'X-Admin-Secret': ADMIN_SECRET, 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: orderId, action: 'fulfill', key }),
      });
      const fdata = await fres.json();
      if (fdata.success) toast(`✅ Key emailed to customer (Order #${orderId})`);
    }
  } else {
    toast('❌ ' + (data.error || 'Failed to add key'));
  }
}

// ── Shared fetch helper ───────────────────────────────────────────
async function adminPost(endpoint, body) {
  try {
    const res = await fetch(`${API_BASE}/${endpoint}`, {
      method: 'POST',
      headers: { 'X-Admin-Secret': ADMIN_SECRET, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { toast(`❌ Server error (HTTP ${res.status}): ${text.slice(0, 120)}`); return null; }
    return data;
  } catch (e) {
    toast(`❌ Network error: ${e.message}`);
    return null;
  }
}

// ── Manage key ───────────────────────────────────────────────────
async function manageKey(key, action) {
  const labels = { deactivate:'Deactivate', activate:'Activate', 'reset-devices':'Reset devices for' };
  if (!confirm(`${labels[action]} key ${key}?`)) return;

  const data = await adminPost('admin-manage.php', { key, action });
  if (!data) return;
  if (data.success) {
    toast(`✅ ${data.message}`);
    loadKeys();
  } else {
    toast('❌ ' + (data.error || 'Failed'));
  }
}

// ── Delete key ───────────────────────────────────────────────────
async function deleteKey(key) {
  if (!confirm(`⚠️ Permanently DELETE key ${key}?\n\nThis will:\n• Remove the key from the database\n• Revoke all device activations\n• Lock out the customer immediately\n\nThis cannot be undone!`)) return;
  if (!confirm(`Are you absolutely sure you want to delete ${key}?`)) return;

  const data = await adminPost('admin-manage.php', { key, action: 'delete' });
  if (!data) return;
  if (data.success) {
    toast(`🗑️ Key ${key} permanently deleted`);
    loadKeys();
  } else {
    toast('❌ ' + (data.error || 'Failed to delete'));
  }
}

// ── Helpers ───────────────────────────────────────────────────────
function generateKey() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const seg = () => Array.from({length:4}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  document.getElementById('newKey').value = `${seg()}-${seg()}-${seg()}-${seg()}`;
}

function copyKey(key) {
  navigator.clipboard.writeText(key).then(() => {
    const el = document.getElementById(`copied-${key}`);
    el.style.display = 'inline';
    setTimeout(() => el.style.display = 'none', 2000);
  });
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.style.display = 'none', 3000);
}

// ── Orders ────────────────────────────────────────────────────────
async function loadOrders() {
  try {
    const res = await fetch(`${API_BASE}/admin-orders.php`, {
      headers: { 'X-Admin-Secret': ADMIN_SECRET }
    });
    const text = await res.text();
    try { allOrders = JSON.parse(text); } catch { allOrders = []; }
  } catch (e) { allOrders = []; }
  renderOrders();
  // Badge count for pending+paid
  const pending = allOrders.filter(o => o.status === 'pending' || o.status === 'paid').length;
  const badge = document.getElementById('pendingCount');
  badge.textContent = pending;
  badge.style.display = pending > 0 ? 'inline-block' : 'none';
}

function renderOrders() {
  const filter = document.getElementById('orderFilter').value;
  const list   = filter === 'all' ? allOrders : allOrders.filter(o => o.status === filter);
  const el     = document.getElementById('orderList');

  if (list.length === 0) { el.innerHTML = '<div class="empty">No orders found</div>'; return; }

  const priceMap = { '1': '$4.99/mo', '2': '$8/mo', '3': '$10/mo' };

  el.innerHTML = list.map(o => {
    const badgeClass = { pending:'badge-pending', paid:'badge-paid',
                         fulfilled:'badge-fulfilled', cancelled:'badge-cancelled' }[o.status] || '';
    const label = { pending:'⏳ Pending', paid:'💳 Paid', fulfilled:'✅ Fulfilled', cancelled:'✗ Cancelled' }[o.status] || o.status;
    const price = priceMap[o.devices] || `${o.devices} devices`;
    const keyInfo = o.fulfilled_key ? `<span>🗝️ ${o.fulfilled_key}</span>` : '';
    return `
    <div class="orderCard" id="ord-${o.id}">
      <div class="orderTop">
        <span class="orderName">${o.restaurant}</span>
        <span class="badge ${badgeClass}">${label}</span>
        <span style="font-size:13px;font-weight:700;color:#E65100">${price}</span>
      </div>
      <div class="orderMeta">
        <span>👤 ${o.name}</span>
        <span>✉️ <a href="mailto:${o.email}" style="color:#1565C0">${o.email}</a></span>
        ${o.phone ? `<span>📞 ${o.phone}</span>` : ''}
        ${o.device_id ? `<span style="font-family:monospace;font-size:11px">📱 ${o.device_id}</span>` : ''}
        <span>📅 ${o.created_at ? o.created_at.split(' ')[0] : '—'}</span>
        ${keyInfo}
      </div>
      ${o.notes ? `<div style="font-size:12px;color:#888;margin-top:4px">📝 ${o.notes}</div>` : ''}
      <div class="orderActions">
        ${o.status === 'pending' ? `<button class="btn btn-warning btn-sm" onclick="markPaid(${o.id})">💳 Mark Paid</button>` : ''}
        ${(o.status === 'pending' || o.status === 'paid') ? `
          <button class="btn btn-success btn-sm" onclick="prefillAndCreateKey('${o.restaurant}', '${o.email}', ${o.id}, ${o.devices})">🗝️ Create &amp; Send Key</button>
        ` : ''}
        ${o.status !== 'cancelled' && o.status !== 'fulfilled' ? `
          <button class="btn btn-outline btn-sm" onclick="cancelOrder(${o.id})">✕ Cancel</button>
        ` : ''}
      </div>
    </div>`;
  }).join('');
}

async function markPaid(id) {
  const data = await adminPost('admin-orders.php', { id, action: 'mark-paid' });
  if (!data) return;
  if (data.success) { toast('✅ Marked as paid'); loadOrders(); }
  else toast('❌ ' + data.error);
}

async function cancelOrder(id) {
  if (!confirm('Cancel this order?')) return;
  const data = await adminPost('admin-orders.php', { id, action: 'cancel' });
  if (!data) return;
  if (data.success) { toast('✅ Order cancelled'); loadOrders(); }
  else toast('❌ ' + data.error);
}

// Pre-fill the key creation form with order data, switch to Keys tab
function prefillAndCreateKey(restaurant, email, orderId, devices) {
  switchTab('keys');
  generateKey(); // auto-generate a key code
  document.getElementById('newCustomer').value = restaurant;
  document.getElementById('newNotes').value    = `Order #${orderId} — ${email}`;
  const sel = document.getElementById('newMaxDevices');
  if (sel) { sel.value = devices <= 3 ? devices : 1; }
  // Scroll to add form
  document.querySelector('.addCard').scrollIntoView({ behavior: 'smooth' });
  // Store orderId so addKey() can fulfill it after creation
  window._pendingOrderId = orderId;
  toast('⬆️ Key form filled — click Add Key to create and email to customer');
}
</script>
</body>
</html>
